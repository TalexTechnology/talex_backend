name: Deploy backend → cPanel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish cpanel-live
        run: |
          set -euo pipefail
          git config user.email "deploy@talex.com.co"
          git config user.name "TaleX deploy"
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.action }}" = "closed" ]; then
            git fetch origin main
            SHA="$(git rev-parse FETCH_HEAD)"
            echo "La API de cPanel vuelve a main."
          else
            SHA="${{ github.sha }}"
            echo "La API de cPanel queda en ${SHA}."
          fi
          git push origin "${SHA}:refs/heads/cpanel-live" --force
